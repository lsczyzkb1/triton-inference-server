name: Build Triton 2.73.0 Windows CPU
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Triton分支/标签'
        required: true
        default: 'main'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}
          submodules: recursive

      - name: 配置MSVC编译环境
        uses: ilammy/msvc-dev-cmd@v1

      - name: 安装CMake和Ninja
        run: choco install cmake ninja -y

      - name: CMake配置 关闭所有GPU依赖
        run: |
          cmake -B build -G Ninja `
          -DCMAKE_BUILD_TYPE=Release `
          -DTRITON_ENABLE_GPU=OFF `
          -DTRITON_ENABLE_TENSORRT=OFF `
          -DTRITON_ENABLE_PYTORCH=OFF `
          -DTRITON_ENABLE_TENSORFLOW=OFF `
          -DTRITON_BACKEND_REPO_TAG=r2.73.0

      - name: 多线程编译
        run: cmake --build build -j 8

      - name: 打包成品压缩包
        run: 7z a triton-windows-cpu-release.zip ./build/install/*

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: triton-windows-x64-cpu
          path: triton-windows-cpu-release.zip
