name: Build Triton 2.73.0 Windows CPU
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Triton分支/标签'
        required: true
        default: 'main'

# 完全屏蔽Node版本兼容问题的环境变量
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build:
    # 改用预装完整VS2022的windows-2022官方镜像，比windows-2025兼容更好
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.event.inputs.ref }}
          submodules: recursive
          fetch-depth: 0

      # 完全抛弃有问题的ilammy/msvc-dev-cmd，直接调用系统原生的VS环境加载脚本
      - name: 原生加载MSVC 2022编译环境
        run: |
          "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cl
        shell: cmd

      - name: 安装CMake和Ninja
        run: choco install cmake ninja --no-progress -y

      - name: CMake配置 关闭所有GPU依赖
        run: |
          cmake -B build -G Ninja `
          -DCMAKE_BUILD_TYPE=Release `
          -DTRITON_ENABLE_GPU=OFF `
          -DTRITON_ENABLE_TENSORRT=OFF `
          -DTRITON_ENABLE_PYTORCH=OFF `
          -DTRITON_ENABLE_TENSORFLOW=OFF `
          -DTRITON_BACKEND_REPO_TAG=r2.73.0

      - name: 多线程编译核心目标
        run: cmake --build build -j 8 --target tritonserver

      - name: 打包成品压缩包
        run: 7z a triton-windows-cpu-release.zip ./build/install/bin/tritonserver.exe ./build/install/bin/*.dll ./build/install/backends/

      - name: 上传编译产物
        uses: actions/upload-artifact@v4.4.3
        with:
          name: triton-windows-x64-cpu
          path: triton-windows-cpu-release.zip
          retention-days: 30
