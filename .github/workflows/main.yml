name: Build Triton 2.73.0 Windows CPU
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Triton分支/标签'
        required: true
        default: 'main'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.event.inputs.ref }}
          submodules: recursive
          fetch-depth: 0

      # 用call命令加载MSVC环境，确保环境变量持久化生效，强制指定cl.exe为编译器
      - name: 加载MSVC 2022原生编译环境
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          echo "CC=cl.exe" >> $env:GITHUB_ENV
          echo "CXX=cl.exe" >> $env:GITHUB_ENV
          cl
        shell: cmd

      - name: 卸载MinGW避免编译器冲突
        run: choco uninstall mingw -x -y --no-progress

      - name: 安装CMake和Ninja
        run: choco install cmake ninja --no-progress -y

      # 把所有参数写在单行，彻底避免PowerShell反引号转义出错的问题，同时关闭所有GPU相关的隐含开关
      - name: CMake纯CPU模式配置
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl.exe -DCMAKE_CXX_COMPILER=cl.exe -DTRITON_ENABLE_GPU=OFF -DTRITON_ENABLE_TENSORRT=OFF -DTRITON_ENABLE_METRICS_GPU=OFF -DTRITON_ENABLE_PYTORCH=OFF -DTRITON_ENABLE_TENSORFLOW=OFF -DTRITON_BACKEND_REPO_TAG="r2.73.0"

      - name: 多线程编译核心目标
        run: cmake --build build -j 8 --target tritonserver

      - name: 打包成品压缩包
        run: 7z a triton-windows-cpu-release.zip ./build/install/bin/tritonserver.exe ./build/install/bin/*.dll ./build/install/backends/

      - name: 上传编译产物
        uses: actions/upload-artifact@v4.4.3
        with:
          name: triton-windows-x64-cpu
          path: triton-windows-cpu-release.zip
          retention-days: 30
