name: Build Triton 2.73.0 Windows CPU
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Triton分支/标签'
        required: true
        default: 'main'

# 全局声明Node24兼容变量，完全消除弃用警告
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-2025
    steps:
      # 升级到完全原生支持Node24的最新checkout版本
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.event.inputs.ref }}
          submodules: recursive
          fetch-depth: 0

      # 修正参数名：把错误的msvc-version改成官方合法的vsversion，避免参数校验失败
      - name: 配置MSVC编译环境
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64
          vsversion: '17'

      - name: 安装CMake和Ninja
        run: choco install cmake ninja --no-progress -y

      - name: CMake配置 关闭所有GPU依赖
        run: |
          cmake -B build -G Ninja `
          -DCMAKE_BUILD_TYPE=Release `
          -DTRITON_ENABLE_GPU=OFF `
          -DTRITON_ENABLE_TENSORRT=OFF `
          -DTRITON_ENABLE_PYTORCH=OFF `
          -DTRITON_ENABLE_TENSORFLOW=OFF `
          -DTRITON_BACKEND_REPO_TAG=r2.73.0

      - name: 多线程编译核心目标
        run: cmake --build build -j 8 --target tritonserver

      - name: 打包成品压缩包
        run: 7z a triton-windows-cpu-release.zip ./build/install/bin/tritonserver.exe ./build/install/bin/*.dll ./build/install/backends/

      # 升级到完全支持Node24的最新上传Action
      - name: 上传编译产物
        uses: actions/upload-artifact@v4.4.3
        with:
          name: triton-windows-x64-cpu
          path: triton-windows-cpu-release.zip
          retention-days: 30
